services:
  db:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: demo_local_only
      POSTGRES_DB: routesphere
    volumes:
      - data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U postgres -d routesphere']
      interval: 3s
      timeout: 3s
      retries: 20
  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql://postgres:demo_local_only@db/routesphere
    depends_on:
      db:
        condition: service_healthy
    ports: ['127.0.0.1:4000:4000']
  tracking:
    build: ./tracking
    environment:
      DATABASE_URL: postgresql://postgres:demo_local_only@db/routesphere
    depends_on:
      db:
        condition: service_healthy
    ports: ['127.0.0.1:8000:8000']
  web:
    build: ./web
    ports: ['127.0.0.1:3000:3000']
  redis:
    image: redis:7-alpine
volumes:
  data:
